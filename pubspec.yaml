name: native_nourish
description: "NativeNourish - West African Nutrition & Fitness Tracker Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  intl: ^0.20.3
  google_fonts: ^8.2.1
  pedometer: ^4.0.1
  permission_handler: 11.3.1
  image_picker: ^1.2.4
  http: ^1.6.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
